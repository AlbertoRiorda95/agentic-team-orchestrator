# .github/workflows/workflow-lint.yml: checks the workflow files themselves.
# A mistake in a workflow file (for example hashFiles() in a job-level `if`)
# makes GitHub reject the whole file: no job runs and the PR shows no checks.
# That cannot be caught from inside the same file, hence this separate workflow.
# It has no path filter, so it can also be a required check.
name: Workflow lint
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: ./ci/install-scanners.sh actionlint
      - run: actionlint