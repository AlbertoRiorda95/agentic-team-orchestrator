# .github/workflows/claude.yml
name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Comments on an issue with the agent:split label belong to split.yml.
    if: contains(github.event.comment.body, '@claude') && !contains(github.event.issue.labels.*.name, 'agent:split')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devorchestrator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # test database only, on the job's service container
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/devorchestrator_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: ${{ hashFiles('backend/uv.lock') != '' }}
          cache-dependency-glob: backend/uv.lock
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967  # v1.0.252
        env:
          # In CI everything runs in the foreground: background subagents or commands are lost when the run ends.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # build and test commands of the stack: npm/npx, uv, make
          claude_args: |
            --max-turns 15
            --model claude-sonnet-5-5
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(uv:*),Bash(make:*)"