openapi: 3.1.0
info:
  title: DevOrchestrator API
  version: 0.1.0
  description: First version of the contract, written in the project design (docs/design/project.md).
    From the first backend task on, this file is exported from FastAPI with `make openapi`.
servers:
- url: http://localhost:8000/api/v1
  description: local development
security:
- bearerAuth: []
tags:
- name: auth
- name: users
- name: settings
- name: projects
- name: providers
- name: roles
- name: specs
- name: studio
- name: tasks
- name: review
- name: decisions
- name: security
- name: costs
- name: overview
- name: devices
- name: audit
- name: stream
- name: health
paths:
  /auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: Sign in
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': &id001
          $ref: '#/components/responses/Unauthorized'
        '422': &id002
          $ref: '#/components/responses/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /auth/refresh:
    post:
      operationId: refreshToken
      tags:
      - auth
      summary: Exchange a refresh token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401': *id001
        '422': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security: []
  /auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      summary: Revoke the current refresh token
      responses:
        '204':
          description: No content
        '401': *id001
  /me:
    get:
      operationId: getMe
      tags:
      - auth
      summary: Current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': *id001
  /users:
    get:
      operationId: listUsers
      tags:
      - users
      summary: List users (owner)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401': *id001
        '403': &id003
          $ref: '#/components/responses/Forbidden'
      parameters: &id007
      - &id010
        $ref: '#/components/parameters/Cursor'
      - &id011
        $ref: '#/components/parameters/Limit'
    post:
      operationId: createUser
      tags:
      - users
      summary: Create a user (owner)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': *id001
        '403': *id003
        '409': &id005
          $ref: '#/components/responses/Conflict'
        '422': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
  /users/{id}:
    patch:
      operationId: updateUser
      tags:
      - users
      summary: Update a user (owner)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': *id001
        '403': *id003
        '404': &id004
          $ref: '#/components/responses/NotFound'
        '422': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      parameters:
      - &id006
        name: id
        in: path
        required: true
        schema: &id008
          type: string
          format: uuid
    delete:
      operationId: deleteUser
      tags:
      - users
      summary: Deactivate a user (owner)
      responses:
        '204':
          description: No content
        '401': *id001
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - *id006
  /installation:
    get:
      operationId: getInstallation
      tags:
      - settings
      summary: Installation budget and period
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationSettings'
        '401': *id001
    patch:
      operationId: updateInstallation
      tags:
      - settings
      summary: Change the installation budget (owner)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationSettings'
        '401': *id001
        '403': *id003
        '422': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallationSettingsUpdate'
  /projects:
    get:
      operationId: listProjects
      tags:
      - projects
      summary: List projects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401': *id001
      parameters: *id007
    post:
      operationId: createProject
      tags:
      - projects
      summary: Add a project (owner)
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401': *id001
        '403': *id003
        '409': *id005
        '422': *id002
      description: Clones the repository and runs the configuration check asynchronously; progress on
        the stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
  /projects/{project_id}:
    get:
      operationId: getProject
      tags:
      - projects
      summary: Get a project
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401': *id001
        '404': *id004
      parameters:
      - &id009
        name: project_id
        in: path
        required: true
        schema: *id008
    patch:
      operationId: updateProject
      tags:
      - projects
      summary: Update a project (owner)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401': *id001
        '403': *id003
        '404': *id004
        '422': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      parameters:
      - *id009
    delete:
      operationId: deleteProject
      tags:
      - projects
      summary: Remove a project (owner)
      responses:
        '204':
          description: No content
        '401': *id001
        '403': *id003
        '404': *id004
        '409': *id005
      description: Refused with 409 while tasks or assessments are running.
      parameters:
      - *id009
  /projects/{project_id}/check:
    post:
      operationId: checkProject
      tags:
      - projects
      summary: Re-run the configuration check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigCheck'
        '401': *id001
        '403': *id003
        '404': *id004
      parameters:
      - *id009
  /projects/{project_id}/budget:
    get:
      operationId: getProjectBudget
      tags:
      - projects
      summary: Current budget period
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetPeriod'
        '401': *id001
        '404': *id004
      parameters:
      - *id009
  /providers:
    get:
      operationId: listProviders
      tags:
      - providers
      summary: List providers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPage'
        '401': *id001
      parameters: *id007
    post:
      operationId: createProvider
      tags:
      - providers
      summary: Add a provider (owner)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '401': *id001
        '403': *id003
        '422': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCreate'
  /providers/{id}:
    get:
      operationId: getProvider
      tags:
      - providers
      summary: Get a provider
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '401': *id001
        '404': *id004
      parameters:
      - *id006
    patch:
      operationId: updateProvider
      tags:
      - providers
      summary: Update a provider (owner)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '401': *id001
        '403': *id003
        '404': *id004
        '422': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderUpdate'
      parameters:
      - *id006
    delete:
      operationId: deleteProvider
      tags:
      - providers
      summary: Remove a provider (owner)
      responses:
        '204':
          description: No content
        '401': *id001
        '403': *id003
        '404': *id004
        '409': *id005
      description: Refused with 409 while a role configuration uses one of its models.
      parameters:
      - *id006
  /providers/{id}/test:
    post:
      operationId: testProvider
      tags:
      - providers
      summary: Test the connection (owner)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTest'
        '401': *id001
        '403': *id003
        '404': *id004
      parameters:
      - *id006
  /providers/{id}/models/refresh:
    post:
      operationId: refreshProviderModels
      tags:
      - providers
      summary: Read the available models from the provider (owner)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
        '401': *id001
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - *id006
  /models:
    get:
      operationId: listModels
      tags:
      - providers
      summary: List models
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPage'
        '401': *id001
      parameters:
      - *id010
      - *id011
      - name: harness
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Harness'
      - name: provider_id
        in: query
        required: false
        schema: *id008
      - name: available
        in: query
        required: false
        schema:
          type: boolean
  /models/{id}:
    patch:
      operationId: updateModel
      tags:
      - providers
      summary: Set display name and prices (owner)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '401': *id001
        '403': *id003
        '404': *id004
        '422': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpdate'
      parameters:
      - *id006
  /role-configs:
    get:
      operationId: listRoleConfigs
      tags:
      - roles
      summary: Role configurations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleConfig'
        '401': *id001
      parameters:
      - name: project_id
        in: query
        required: false
        schema: *id008
        description: Effective configuration for this project (overrides applied).
  /role-configs/{role}:
    put:
      operationId: setGlobalRoleConfig
      tags:
      - roles
      summary: Set the global configuration of a role (owner)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleConfig'
        '401': *id001
        '403': *id003
        '404': *id004
        '422': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleConfigUpdate'
      parameters:
      - name: role
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AgentRole'
  /projects/{project_id}/role-configs/{role}:
    put:
      operationId: setProjectRoleConfig
      tags:
      - roles
      summary: Override a role for a project (owner)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleConfig'
        '401': *id001
        '403': *id003
        '404': *id004
        '422': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleConfigUpdate'
      parameters:
      - *id009
      - name: role
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AgentRole'
    delete:
      operationId: deleteProjectRoleConfig
      tags:
      - roles
      summary: Remove a project override (owner)
      responses:
        '204':
          description: No content
        '401': *id001
        '403': *id003
        '404': *id004
      parameters:
      - *id009
      - name: role
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AgentRole'
  /projects/{project_id}/specs:
    get:
      operationId: listSpecs
      tags:
      - specs
      summary: Specs in docs/design/
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Spec'
        '401': *id001
        '404': *id004
      parameters:
      - *id009
      - name: ready
        in: query
        required: false
        schema:
          type: boolean
  /projects/{project_id}/specs/content:
    get:
      operationId: getSpec
      tags:
      - specs
      summary: One spec, with checklist and open questions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecContent'
        '401': *id001
        '404': *id004
      parameters:
      - *id009
      - name: path
        in: query
        required: true
        schema:
          type: string
  /projects/{project_id}/studio-sessions:
    get:
      operationId: listStudioSessions
      tags:
      - studio
      summary: Studio sessions of a project
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSessionPage'
        '401': *id001
        '404': *id004
      parameters:
      - *id009
      - *id010
      - *id011
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/StudioState'
    post:
      operationId: createStudioSession
      tags:
      - studio
      summary: Start a studio session (lead)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSession'
        '401': *id001
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudioSessionCreate'
      parameters:
      - *id009
  /studio-sessions/{id}:
    get:
      operationId: getStudioSession
      tags:
      - studio
      summary: Get a studio session
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSession'
        '401': *id001
        '404': *id004
      parameters:
      - *id006
  /studio-sessions/{id}/messages:
    get:
      operationId: listStudioMessages
      tags:
      - studio
      summary: Conversation history
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioMessagePage'
        '401': *id001
        '404': *id004
      parameters:
      - *id006
      - *id010
      - *id011
    post:
      operationId: sendStudioMessage
      tags:
      - studio
      summary: Send a message to the designer (lead)
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioMessage'
        '401': *id001
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id002
      description: The designer's answer streams as studio_message events. 409 while the previous answer
        is still streaming.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudioMessageCreate'
      parameters:
      - *id006
  /studio-sessions/{id}/finalize:
    post:
      operationId: finalizeStudioSession
      tags:
      - studio
      summary: Check the spec and open the design PR (lead)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizeResult'
        '401': *id001
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - *id006
  /studio-sessions/{id}/abandon:
    post:
      operationId: abandonStudioSession
      tags:
      - studio
      summary: Abandon a session (lead)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSession'
        '401': *id001
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - *id006
  /tasks:
    get:
      operationId: listTasks
      tags:
      - tasks
      summary: List tasks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '401': *id001
      parameters:
      - *id010
      - *id011
      - name: project_id
        in: query
        required: false
        schema: *id008
      - name: state
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TaskState'
      - name: role
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AgentRole'
      - name: priority
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Priority'
    post:
      operationId: createTask
      tags:
      - tasks
      summary: Create a task (lead)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401': *id001
        '403': *id003
        '404': *id004
        '422': *id002
      description: 422 when the spec is missing or not ready, or a model is not available for its harness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
  /tasks/{id}:
    get:
      operationId: getTask
      tags:
      - tasks
      summary: Get a task
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401': *id001
        '404': *id004
      parameters:
      - *id006
    patch:
      operationId: updateTask
      tags:
      - tasks
      summary: Update a task (lead)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401': *id001
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      parameters:
      - *id006
  /tasks/{id}/stop:
    post:
      operationId: stopTask
      tags:
      - tasks
      summary: Stop a running task (lead)
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401': *id001
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - *id006
  /tasks/{id}/retry:
    post:
      operationId: retryTask
      tags:
      - tasks
      summary: Retry a failed task (lead)
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401': *id001
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - *id006
  /tasks/{id}/cancel:
    post:
      operationId: cancelTask
      tags:
      - tasks
      summary: Cancel a task (lead)
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401': *id001
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - *id006
  /tasks/{id}/steps:
    get:
      operationId: listSteps
      tags:
      - tasks
      summary: Steps of a task
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Step'
        '401': *id001
        '404': *id004
      parameters:
      - *id006
  /steps/{id}/events:
    get:
      operationId: listStepEvents
      tags:
      - tasks
      summary: Log history of a step
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '401': *id001
        '404': *id004
      parameters:
      - *id006
      - *id010
      - *id011
      - name: after_sequence
        in: query
        required: false
        schema:
          type: integer
          format: int64
  /steps/{id}/diff:
    get:
      operationId: getStepDiff
      tags:
      - tasks
      summary: Diff of the commit made by a step
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepDiff'
        '401': *id001
        '404': *id004
      parameters:
      - *id006
  /tasks/{id}/ci-checks:
    get:
      operationId: listCiChecks
      tags:
      - tasks
      summary: CI checks of the task's PR
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CiCheck'
        '401': *id001
        '404': *id004
      parameters:
      - *id006
  /tasks/{id}/alignment-entries:
    get:
      operationId: listAlignmentEntries
      tags:
      - tasks
      summary: Alignment entries opened by the task
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
