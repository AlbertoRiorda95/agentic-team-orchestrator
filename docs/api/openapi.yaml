components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    BadRequest:
      description: Malformed request
      content: &id013
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid credentials
      content: *id013
    Forbidden:
      description: The user's role does not allow this
      content: *id013
    NotFound:
      description: Not found
      content: *id013
    Conflict:
      description: The resource is in a state that does not allow this
      content: *id013
    ValidationError:
      description: Validation failed
      content: *id013
  schemas:
    UserRole:
      type: string
      enum:
      - owner
      - lead
      - viewer
    AgentRole:
      type: string
      enum:
      - designer
      - frontend
      - backend
      - devops
      - optimizer
      - security
    Harness:
      type: string
      enum:
      - claude
      - opencode
    ProviderType:
      type: string
      enum:
      - anthropic_api
      - claude_subscription
      - cloud_api
      - self_hosted
    ConnectionState:
      type: string
      enum:
      - unknown
      - ok
      - failed
    Priority:
      type: string
      enum:
      - P0
      - P1
      - P2
      - P3
      description: P0 is the highest. FIFO within a priority.
    AlignmentPolicy:
      type: string
      enum:
      - ask
      - auto
    TaskState:
      type: string
      enum:
      - blocked
      - queued
      - running
      - waiting_human
      - in_review
      - done
      - failed
      - cancelled
    TaskOrigin:
      type: string
      enum:
      - manual
      - studio
      - security_finding
    StepState:
      type: string
      enum:
      - pending
      - running
      - done
      - failed
      - skipped
    StepReason:
      type: string
      enum:
      - planned
      - alignment
      - fix
      - review
      - reply
    EventKind:
      type: string
      enum:
      - text
      - tool_use
      - tool_result
      - test
      - ci
      - state
      - decision
      - studio_message
      - finding
    DecisionReason:
      type: string
      enum:
      - alignment
      - budget
      - tests
      - ci
      - conflict
      - agent_question
    DecisionState:
      type: string
      enum:
      - open
      - answered
      - stale
    DecisionAction:
      type: string
      enum:
      - approve
      - reject
      - retry
      - raise_budget
      - cancel
      - reply
    ReviewCommentState:
      type: string
      enum:
      - draft
      - sent
      - addressed
    CiConclusion:
      type: string
      enum:
      - pending
      - success
      - failure
      - cancelled
      - skipped
    AlignmentState:
      type: string
      enum:
      - open
      - resolved
    StudioState:
      type: string
      enum:
      - active
      - in_review
      - merged
      - abandoned
    AssessmentState:
      type: string
      enum:
      - queued
      - running
      - done
      - failed
      - cancelled
    Severity:
      type: string
      enum:
      - critical
      - high
      - medium
      - low
      - suspected
    FindingState:
      type: string
      enum:
      - open
      - task_created
      - fixed
      - accepted
    Platform:
      type: string
      enum:
      - ios
      - android
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: Validation errors, one per field.
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
      description: RFC 9457 problem details, used by every error response.
    BudgetPeriod:
      type: object
      properties:
        limit_usd: &id014
          type: number
          format: double
          minimum: 0
          description: US dollars
        spent_usd: *id014
        period_start: *id012
        period_end: *id012
      required:
      - limit_usd
      - spent_usd
      - period_start
      - period_end
      description: A rolling 30-day period anchored at the creation date of the project or installation.
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
      - email
      - password
      description: Login method is confirmed in the project design, round 6.
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Seconds until the access token expires.
      required:
      - access_token
      - refresh_token
      - expires_in
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
    User:
      type: object
      properties:
        id: *id008
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
        created_at: *id012
      required:
      - id
      - email
      - name
      - role
      - active
      - created_at
    UserCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
      required:
      - email
      - name
      - role
    UserUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
    ConfigCheck:
      type: object
      properties:
        ok:
          type: boolean
        checked_at: *id012
        missing:
          type: array
          items:
            type: string
          description: Template files or folders that are missing, e.g. AGENTS.md, .claude/, docs/roles/backend.md.
      required:
      - ok
      - checked_at
      - missing
    Project:
      type: object
      properties:
        id: *id008
        name:
          type: string
        repository:
          type: string
          description: GitHub owner/name
          examples:
          - AlbertoRiorda95/agentic-team-orchestrator
        default_branch:
          type: string
        config_check:
          $ref: '#/components/schemas/ConfigCheck'
        budget_usd: *id014
        alignment_policy:
          $ref: '#/components/schemas/AlignmentPolicy'
        active:
          type: boolean
        created_at: *id012
      required:
      - id
      - name
      - repository
      - default_branch
      - config_check
      - budget_usd
      - alignment_policy
      - active
      - created_at
    ProjectCreate:
      type: object
      properties:
        name:
          type: string
        repository:
          type: string
        budget_usd: *id014
        alignment_policy:
          $ref: '#/components/schemas/AlignmentPolicy'
      required:
      - name
      - repository
      - budget_usd
    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        budget_usd: *id014
        alignment_policy:
          $ref: '#/components/schemas/AlignmentPolicy'
        active:
          type: boolean
    Provider:
      type: object
      properties:
        id: *id008
        name:
          type: string
        type:
          $ref: '#/components/schemas/ProviderType'
        harness:
          $ref: '#/components/schemas/Harness'
        base_url:
          type:
          - string
          - 'null'
          format: uri
        has_credential:
          type: boolean
          description: Credentials are write-only and never returned.
        connection_state:
          $ref: '#/components/schemas/ConnectionState'
        last_checked_at:
          type:
          - string
          - 'null'
          format: date-time
        last_error: &id015
          type:
          - string
          - 'null'
        model_count:
          type: integer
      required:
      - id
      - name
      - type
      - harness
      - base_url
      - has_credential
      - connection_state
      - last_checked_at
      - model_count
    ProviderCreate:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/ProviderType'
        base_url:
          type: string
          format: uri
          description: Required for self_hosted.
        credential:
          type: string
          writeOnly: true
          description: API key or token; optional for self_hosted.
      required:
      - name
      - type
    ProviderUpdate:
      type: object
      properties:
        name:
          type: string
        base_url:
          type: string
          format: uri
        credential:
          type: string
          writeOnly: true
    ConnectionTest:
      type: object
      properties:
        ok:
          type: boolean
        error: *id015
        checked_at: *id012
      required:
      - ok
      - checked_at
    Model:
      type: object
      properties:
        id: *id008
        provider_id: *id008
        harness:
          $ref: '#/components/schemas/Harness'
        model_id:
          type: string
          description: As the provider names it, e.g. claude-opus-5-5.
        display_name:
          type: string
        input_price_per_mtok:
          type:
          - number
          - 'null'
        output_price_per_mtok:
          type:
          - number
          - 'null'
        available:
          type: boolean
      required:
      - id
      - provider_id
      - harness
      - model_id
      - display_name
      - available
    ModelUpdate:
      type: object
      properties:
        display_name:
          type: string
        input_price_per_mtok:
          type:
          - number
          - 'null'
        output_price_per_mtok:
          type:
          - number
          - 'null'
    RoleConfig:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/AgentRole'
        model_id: *id008
        max_turns:
          type: integer
          minimum: 1
        max_concurrent:
          type: integer
          minimum: 1
        project_id:
          type:
          - string
          - 'null'
          format: uuid
          description: null for the global configuration.
        model_unavailable:
          type: boolean
          description: True when the model disappeared from its provider.
      required:
      - role
      - model_id
      - max_turns
