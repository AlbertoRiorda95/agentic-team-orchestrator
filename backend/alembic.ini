# Alembic configuration. The database URL is not here: env.py reads it from
# the DATABASE_URL environment variable (app.settings.Settings).
#
#   uv run --directory backend alembic upgrade head
#   uv run --directory backend alembic revision --autogenerate --rev-id 0002 -m "add users"

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# revisions are numbered: 0001_baseline.py, 0002_<slug>.py, ...
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
